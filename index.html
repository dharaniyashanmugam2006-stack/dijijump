<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Start Menu -->
        <div id="start-menu" class="glass-panel">
            <h1>Jump Challenge</h1>
            
            <div class="player-setup">
                <div class="player-card">
                    <h3>Player 1</h3>
                    <input type="text" id="p1-name" placeholder="Name (e.g. Alice)" value="Player 1">
                    <div class="emoji-selector" id="p1-emojis">
                        <span class="emoji-option selected" data-emoji="🦖">🦖</span>
                        <span class="emoji-option" data-emoji="🚀">🚀</span>
                        <span class="emoji-option" data-emoji="🦊">🦊</span>
                        <span class="emoji-option" data-emoji="🐱">🐱</span>
                    </div>
                </div>

                <div class="player-card">
                    <h3>Player 2</h3>
                    <input type="text" id="p2-name" placeholder="Name (e.g. Bob)" value="Player 2">
                    <div class="emoji-selector" id="p2-emojis">
                        <span class="emoji-option" data-emoji="🦖">🦖</span>
                        <span class="emoji-option" data-emoji="🚀">🚀</span>
                        <span class="emoji-option" data-emoji="🦊">🦊</span>
                        <span class="emoji-option selected" data-emoji="👽">👽</span>
                    </div>
                </div>
            </div>

            <div class="mode-selector">
                <h3>Platform</h3>
                <div class="mode-buttons">
                    <button class="mode-btn platform-btn active" id="btn-web" data-platform="web">Web (Keyboard)</button>
                    <button class="mode-btn platform-btn" id="btn-mobile" data-platform="mobile">Mobile (Touch)</button>
                </div>
            </div>

            <div class="mode-selector">
                <h3>Game Mode</h3>
                <div class="mode-buttons">
                    <button class="mode-btn active" id="btn-together" data-mode="together">Play Together</button>
                    <button class="mode-btn" id="btn-turn" data-mode="turn">Play One After Another</button>
                </div>
            </div>

            <button id="start-btn" class="primary-btn">Start Game</button>
        </div>

        <!-- Game Container -->
        <div id="game-container" class="hidden">
            <div class="score-board">
                <div id="p1-score-display" class="score-display">
                    <span id="p1-name-display">Player 1</span>: <span id="p1-score">0</span>
                </div>
                <div id="p2-score-display" class="score-display">
                    <span id="p2-name-display">Player 2</span>: <span id="p2-score">0</span>
                </div>
            </div>

            <div id="turn-indicator" class="hidden">
                <h2 id="current-player-turn">Player 1's Turn</h2>
            </div>

            <div id="game-area">
                <div id="ground"></div>
                <div id="player1" class="player-entity">🦖</div>
                <div id="player2" class="player-entity">👽</div>
            </div>
            
            <div class="controls-hint">
                <span id="hint-p1">P1: Jump with <b>W</b></span>
                <span id="hint-p2">P2: Jump with <b>Up Arrow</b></span>
            </div>

            <div id="mobile-controls" class="hidden">
                <button id="p1-jump-btn" class="mobile-btn">P1 Jump</button>
                <button id="p2-jump-btn" class="mobile-btn">P2 Jump</button>
            </div>
        </div>

        <!-- Game Over Menu -->
        <div id="game-over-menu" class="glass-panel hidden">
            <h1>Game Over</h1>
            <h2 id="winner-text"></h2>
            
            <div class="final-scores">
                <p><span id="go-p1-name">P1</span> Score: <span id="go-p1-score">0</span></p>
                <p><span id="go-p2-name">P2</span> Score: <span id="go-p2-score">0</span></p>
            </div>

            <div class="action-buttons">
                <button id="restart-btn" class="primary-btn">Play Again</button>
                <button id="menu-btn" class="secondary-btn">Main Menu</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
